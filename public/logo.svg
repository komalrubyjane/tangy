<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Satisfy&amp;display=swap');
      .brand-title {
        font-family: 'Arial Black', 'Impact', 'Montserrat', sans-serif;
        font-weight: 900;
        font-size: 145px;
        fill: #d9e021;
        letter-spacing: 6px;
      }
      .brand-subtitle {
        font-family: 'Satisfy', 'Brush Script MT', cursive;
        font-size: 130px;
        fill: #51c2a6;
      }
    </style>
    
    <!-- Organic distress filter for the main TANGY text -->
    <filter id="distress" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Mask to cut out the horizontal slots from the blue microphone -->
    <mask id="mic-mask">
      <rect x="0" y="0" width="1000" height="1000" fill="white" />
      <!-- Four horizontal cutouts on the right side of the microphone -->
      <rect x="500" y="245" width="100" height="22" rx="11" fill="black" />
      <rect x="500" y="295" width="100" height="22" rx="11" fill="black" />
      <rect x="500" y="345" width="100" height="22" rx="11" fill="black" />
      <rect x="500" y="395" width="100" height="22" rx="11" fill="black" />
    </mask>
  </defs>

  <!-- Top Arrowhead -->
  <path d="M 500 20 C 530 75, 560 115, 580 150 C 550 150, 520 130, 500 120 C 480 130, 450 150, 420 150 C 440 115, 470 75, 500 20 Z" fill="#51c2a6" />
  <line x1="500" y1="20" x2="500" y2="120" stroke="#51c2a6" stroke-width="8" stroke-linecap="round" />

  <!-- Top Arrow Shaft segment -->
  <line x1="500" y1="120" x2="500" y2="195" stroke="#51c2a6" stroke-width="12" stroke-linecap="round" />

  <!-- Blue Microphone capsule -->
  <rect x="415" y="195" width="170" height="260" rx="85" fill="#3ca1df" mask="url(#mic-mask)" />

  <!-- Cradle -->
  <path d="M 375 290 A 125 125 0 0 0 625 290" fill="none" stroke="#51c2a6" stroke-width="20" stroke-linecap="round" />
  <line x1="500" y1="415" x2="500" y2="455" stroke="#51c2a6" stroke-width="20" stroke-linecap="round" />

  <!-- Horizontal Bow -->
  <path d="M 30 430 C 120 350, 220 290, 310 290 C 380 290, 440 340, 500 395 C 560 340, 620 290, 690 290 C 780 290, 880 350, 970 430 C 890 370, 800 315, 690 315 C 610 315, 560 370, 500 415 C 440 370, 390 315, 310 315 C 200 315, 110 370, 30 430 Z" fill="#51c2a6" />

  <!-- Bow Tip Knots -->
  <path d="M 30 430 C 15 420, 10 440, 25 445 C 35 448, 45 435, 30 430 Z" fill="#51c2a6" />
  <path d="M 970 430 C 985 420, 990 440, 975 445 C 965 448, 955 435, 970 430 Z" fill="#51c2a6" />

  <!-- Text: TANGY -->
  <text x="500" y="585" class="brand-title" text-anchor="middle" filter="url(#distress)">TANGY</text>

  <!-- Text: sessions -->
  <text x="500" y="700" class="brand-subtitle" text-anchor="middle">sessions</text>

  <!-- Bottom Arrow Shaft and Fletchings -->
  <line x1="500" y1="740" x2="500" y2="940" stroke="#51c2a6" stroke-width="12" stroke-linecap="round" />
  
  <!-- Left fletchings -->
  <line x1="500" y1="800" x2="440" y2="850" stroke="#51c2a6" stroke-width="12" stroke-linecap="round" />
  <line x1="500" y1="840" x2="440" y2="890" stroke="#51c2a6" stroke-width="12" stroke-linecap="round" />
  <line x1="500" y1="880" x2="440" y2="930" stroke="#51c2a6" stroke-width="12" stroke-linecap="round" />
  
  <!-- Right fletchings -->
  <line x1="500" y1="800" x2="560" y2="850" stroke="#51c2a6" stroke-width="12" stroke-linecap="round" />
  <line x1="500" y1="840" x2="560" y2="890" stroke="#51c2a6" stroke-width="12" stroke-linecap="round" />
  <line x1="500" y1="880" x2="560" y2="930" stroke="#51c2a6" stroke-width="12" stroke-linecap="round" />
</svg>
